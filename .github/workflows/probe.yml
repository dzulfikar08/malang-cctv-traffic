name: probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Can GitHub Actions reach the Malang CCTV portal?
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          REF="https://cctv.malangkota.go.id/sebaran-cctv"
          CAM="318197263503692449077822"   # Jl. Tlogomas Arah Barat
          echo "--- control: general internet ok? ---"
          curl -sk -o /dev/null --max-time 15 -w "control=%{http_code}\n" https://www.google.com || echo "control failed exit=$?"
          echo "--- egress IP ---"
          curl -sk --max-time 15 https://api.ipify.org || true; echo
          echo "--- warm-up GET (must be 200 and set cookies) ---"
          curl -sk -o /dev/null --max-time 20 -w "page=%{http_code} exit=%{exitcode}\n" -A "$UA" -c /tmp/cj.txt "$REF" || echo "page curl exit=$?"
          grep -c NANCY /tmp/cj.txt || echo "no cookies in jar"
          echo "--- camera API ---"
          curl -sk -o /dev/null --max-time 20 -w "api=%{http_code}\n" -A "$UA" -b /tmp/cj.txt -F "m_kecamatan_id=99" \
            "https://cctv.malangkota.go.id/api/v2/get-cameras" || echo "api curl exit=$?"
          echo "--- live playlist ---"
          curl -sk -o /tmp/pl.m3u8 --max-time 20 -w "m3u8=%{http_code}\n" -A "$UA" -b /tmp/cj.txt -e "$REF" \
            "https://cctv.malangkota.go.id/cctv-stream/streams/$CAM.m3u8" || echo "m3u8 curl exit=$?"
          head -3 /tmp/pl.m3u8 || true
          SEG=$(grep -v '^#' /tmp/pl.m3u8 | head -1)
          echo "--- segment HEAD (bytes = congestion proxy) ---"
          curl -sk -I --max-time 20 -A "$UA" -b /tmp/cj.txt -e "$REF" \
            "https://cctv.malangkota.go.id/cctv-stream/streams/$SEG" | grep -iE "^HTTP|content-length" || echo "seg curl exit=$?"
          echo "--- ffmpeg present? ---"
          ffmpeg -version | head -1
          exit 0

# probe portal reachability from Actions runners
